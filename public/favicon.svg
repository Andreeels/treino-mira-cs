<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Outer Light Ring -->
  <circle cx="256" cy="256" r="180" fill="#EBF2F7" stroke="#201E1F" stroke-width="22" />
  
  <!-- Middle Red Ring -->
  <circle cx="256" cy="256" r="116" fill="#EB3854" stroke="#201E1F" stroke-width="22" />
  
  <!-- Inner Center Bullseye -->
  <circle cx="256" cy="256" r="62" fill="#EBF2F7" stroke="#201E1F" stroke-width="22" />
  
  <!-- 4 Crosshair Bars -->
  <!-- Top Crosshair -->
  <line x1="256" y1="52" x2="256" y2="168" stroke="#201E1F" stroke-width="22" stroke-linecap="round" />
  <!-- Bottom Crosshair -->
  <line x1="256" y1="344" x2="256" y2="460" stroke="#201E1F" stroke-width="22" stroke-linecap="round" />
  <!-- Left Crosshair -->
  <line x1="52" y1="256" x2="168" y2="256" stroke="#201E1F" stroke-width="22" stroke-linecap="round" />
  <!-- Right Crosshair -->
  <line x1="344" y1="256" x2="460" y2="256" stroke="#201E1F" stroke-width="22" stroke-linecap="round" />
</svg>
